name: Build Touch Assist APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/example/touchassist
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TouchAssist"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.touchassist"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.touchassist"
                  minSdk = 24
                  targetSdk = 32
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".GestureEditorActivity"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TouchAccessibilityService"
                      android:label="@string/accessibility_label"
                      android:description="@string/accessibility_description"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/touch_accessibility_service" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Touch Assist</string>
              <string name="accessibility_label">Touch Assist</string>
              <string name="accessibility_description">زر مساعد ينفّذ الأوامر والإيماءات التي يختارها المستخدم.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/touch_accessibility_service.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="50"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/java/com/example/touchassist/MainActivity.kt <<'EOF'
          package com.example.touchassist

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.MotionEvent
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          fun Context.dp(value: Int): Int =
              (value * resources.displayMetrics.density).toInt()

          data class GesturePoint(val x: Float, val y: Float)

          data class GestureStroke(
              val startMs: Long,
              val durationMs: Long,
              val points: List<GesturePoint>
          )

          data class SavedMacro(
              val name: String,
              val strokes: List<GestureStroke>
          )

          object TouchData {
              private const val PREFS = "touch_assist"
              private const val MACROS = "saved_macros"
              private const val MENU = "top_level_menu"

              fun prefs(context: Context) =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun action(context: Context, trigger: String): String {
                  val defaultAction = when (trigger) {
                      "single" -> "menu"
                      else -> "none"
                  }
                  return prefs(context).getString("action_$trigger", defaultAction)
                      ?: defaultAction
              }

              fun setAction(context: Context, trigger: String, action: String) {
                  prefs(context).edit()
                      .putString("action_$trigger", action)
                      .apply()
              }

              private fun pointsFromJson(array: JSONArray): List<GesturePoint> {
                  val points = mutableListOf<GesturePoint>()
                  for (i in 0 until array.length()) {
                      val point = array.optJSONObject(i) ?: continue
                      points.add(
                          GesturePoint(
                              point.optDouble("x").toFloat().coerceIn(0f, 1f),
                              point.optDouble("y").toFloat().coerceIn(0f, 1f)
                          )
                      )
                  }
                  return points
              }

              fun macros(context: Context): List<SavedMacro> {
                  val raw = prefs(context).getString(MACROS, "[]") ?: "[]"
                  val array = try {
                      JSONArray(raw)
                  } catch (_: Exception) {
                      JSONArray()
                  }

                  val result = mutableListOf<SavedMacro>()

                  for (i in 0 until array.length()) {
                      val item = array.optJSONObject(i) ?: continue
                      val name = item.optString("name").trim()
                      val strokesJson = item.optJSONArray("strokes") ?: continue
                      val strokes = mutableListOf<GestureStroke>()

                      for (j in 0 until strokesJson.length()) {
                          val stroke = strokesJson.optJSONObject(j) ?: continue
                          val pointsJson = stroke.optJSONArray("points") ?: continue
                          val points = pointsFromJson(pointsJson)

                          if (points.isNotEmpty()) {
                              strokes.add(
                                  GestureStroke(
                                      stroke.optLong("start", 0L).coerceIn(0L, 10000L),
                                      stroke.optLong("duration", 350L).coerceIn(80L, 10000L),
                                      points
                                  )
                              )
                          }
                      }

                      if (name.isNotEmpty() && strokes.isNotEmpty()) {
                          result.add(SavedMacro(name, strokes))
                      }
                  }
                  return result
              }

              private fun saveMacros(context: Context, macros: List<SavedMacro>) {
                  val root = JSONArray()

                  macros.forEach { macro ->
                      val strokes = JSONArray()

                      macro.strokes.forEach { stroke ->
                          val points = JSONArray()
                          stroke.points.forEach { point ->
                              points.put(
                                  JSONObject()
                                      .put("x", point.x.toDouble())
                                      .put("y", point.y.toDouble())
                              )
                          }
                          strokes.put(
                              JSONObject()
                                  .put("start", stroke.startMs)
                                  .put("duration", stroke.durationMs)
                                  .put("points", points)
                          )
                      }

                      root.put(
                          JSONObject()
                              .put("name", macro.name)
                              .put("strokes", strokes)
                      )
                  }

                  prefs(context).edit()
                      .putString(MACROS, root.toString())
                      .apply()
              }

              fun saveMacro(context: Context, macro: SavedMacro) {
                  val updated = macros(context)
                      .filterNot { it.name.equals(macro.name, ignoreCase = true) }
                      .toMutableList()
                  updated.add(macro)
                  saveMacros(context, updated)
              }

              fun deleteMacro(context: Context, name: String) {
                  saveMacros(
                      context,
                      macros(context).filterNot { it.name == name }
                  )
              }

              fun menuItems(context: Context): List<String> {
                  val defaultMenu = listOf(
                      "home",
                      "device",
                      "notifications",
                      "quick",
                      "gestures",
                      "assistant"
                  )
                  val raw = prefs(context).getString(MENU, null) ?: return defaultMenu

                  return try {
                      val array = JSONArray(raw)
                      (0 until array.length()).map { array.getString(it) }
                  } catch (_: Exception) {
                      defaultMenu
                  }
              }

              fun setMenuItems(context: Context, items: List<String>) {
                  val array = JSONArray()
                  items.take(8).forEach { array.put(it) }
                  prefs(context).edit().putString(MENU, array.toString()).apply()
              }

              fun actionOptions(context: Context): List<Pair<String, String>> {
                  val options = mutableListOf(
                      "لا شيء" to "none",
                      "فتح القائمة" to "menu",
                      "رجوع" to "back",
                      "الرئيسية" to "home",
                      "التطبيقات الأخيرة" to "recents",
                      "الإشعارات" to "notifications",
                      "الإعدادات السريعة" to "quick",
                      "قائمة الجهاز" to "device",
                      "قائمة الإيماءات" to "gestures",
                      "مساعد Android الصوتي" to "assistant",
                      "إعدادات التطبيق" to "settings",
                      "رفع الصوت" to "volume_up",
                      "خفض الصوت" to "volume_down",
                      "كتم الصوت" to "mute",
                      "إلغاء كتم الصوت" to "unmute",
                      "Double-Tap" to "preset:double",
                      "Long Press" to "preset:long",
                      "Hold and Drag" to "preset:drag",
                      "Pinch and Rotate" to "preset:pinch"
                  )

                  if (Build.VERSION.SDK_INT >= 28) {
                      options.add("قفل الشاشة" to "lock")
                      options.add("لقطة شاشة" to "screenshot")
                  }

                  macros(context).forEach {
                      options.add("Macro: ${it.name}" to "macro:${it.name}")
                  }
                  return options
              }

              fun menuOptions(context: Context): List<Pair<String, String>> {
                  val options = mutableListOf(
                      "الرئيسية" to "home",
                      "رجوع" to "back",
                      "التطبيقات الأخيرة" to "recents",
                      "الإشعارات" to "notifications",
                      "الإعدادات السريعة" to "quick",
                      "الجهاز" to "device",
                      "الإيماءات" to "gestures",
                      "مساعد Android الصوتي" to "assistant",
                      "إعدادات التطبيق" to "settings",
                      "Double-Tap" to "preset:double",
                      "Long Press" to "preset:long",
                      "Hold and Drag" to "preset:drag",
                      "Pinch and Rotate" to "preset:pinch"
                  )

                  if (Build.VERSION.SDK_INT >= 28) {
                      options.add("قفل الشاشة" to "lock")
                      options.add("لقطة شاشة" to "screenshot")
                  }

                  macros(context).forEach {
                      options.add("Macro: ${it.name}" to "macro:${it.name}")
                  }
                  return options
              }
          }

          fun displayActionName(context: Context, action: String): String {
              if (action.startsWith("macro:")) {
                  return action.substringAfter("macro:")
              }

              return when (action) {
                  "none" -> "لا شيء"
                  "menu" -> "القائمة"
                  "back" -> "رجوع"
                  "home" -> "الرئيسية"
                  "recents" -> "التطبيقات الأخيرة"
                  "notifications" -> "الإشعارات"
                  "quick" -> "الإعدادات السريعة"
                  "device" -> "الجهاز"
                  "gestures" -> "الإيماءات"
                  "assistant" -> "المساعد الصوتي"
                  "settings" -> "الإعدادات"
                  "volume_up" -> "رفع الصوت"
                  "volume_down" -> "خفض الصوت"
                  "mute" -> "كتم الصوت"
                  "unmute" -> "إلغاء كتم الصوت"
                  "lock" -> "قفل الشاشة"
                  "screenshot" -> "لقطة شاشة"
                  "preset:double" -> "Double-Tap"
                  "preset:long" -> "Long Press"
                  "preset:drag" -> "Hold and Drag"
                  "preset:pinch" -> "Pinch and Rotate"
                  else -> action
              }
          }

          class MainActivity : Activity() {
              override fun onResume() {
                  super.onResume()
                  render()
              }

              private fun render() {
                  window.statusBarColor = Color.rgb(18, 18, 22)
                  window.navigationBarColor = Color.rgb(18, 18, 22)

                  val scroll = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(16), dp(18), dp(24))
                      setBackgroundColor(Color.rgb(20, 20, 24))
                  }
                  scroll.addView(root)

                  root.addView(TextView(this).apply {
                      text = "Touch Assist"
                      textSize = 27f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, dp(8))
                  })

                  val component = ComponentName(
                      this,
                      TouchAccessibilityService::class.java
                  ).flattenToString()

                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ).orEmpty()

                  val enabled = enabledServices.split(':').any {
                      it.equals(component, ignoreCase = true)
                  }

                  addText(
                      root,
                      if (enabled) {
                          "خدمة الوصول مفعّلة؛ الزر العائم يجب أن يظهر."
                      } else {
                          "فعّل Touch Assist من إعدادات إمكانية الوصول حتى يعمل الزر."
                      },
                      15f
                  )

                  addButton(root, "فتح إعدادات إمكانية الوصول") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }

                  addButton(root, "تخصيص القائمة العلوية") {
                      customizeMenu()
                  }

                  addButton(root, "إنشاء إيماءة أو Macro") {
                      startActivity(Intent(this, GestureEditorActivity::class.java))
                  }

                  addHeading(root, "الإجراءات المخصصة")
                  addActionSpinner(root, "الضغطة الواحدة", "single")
                  addActionSpinner(root, "الضغطتان", "double")
                  addActionSpinner(root, "الضغط المطوّل", "long")

                  addHeading(root, "مظهر الزر العائم")
                  addSlider(root, "شفافية الخمول", "idle_opacity", 10, 100, 40, "%")
                  addSlider(root, "حجم الزر", "bubble_size", 44, 90, 58, " dp")

                  addHeading(root, "الإيماءات المحفوظة")
                  val macros = TouchData.macros(this)

                  if (macros.isEmpty()) {
                      addText(root, "لا توجد إيماءات محفوظة حتى الآن.", 14f)
                  } else {
                      macros.forEach { macro ->
                          val row = LinearLayout(this).apply {
                              orientation = LinearLayout.HORIZONTAL
                              gravity = android.view.Gravity.CENTER_VERTICAL
                          }

                          row.addView(
                              TextView(this).apply {
                                  text = "★  ${macro.name}"
                                  textSize = 16f
                                  setTextColor(Color.WHITE)
                              },
                              LinearLayout.LayoutParams(0, dp(50), 1f)
                          )

                          row.addView(Button(this).apply {
                              text = "حذف"
                              setOnClickListener {
                                  AlertDialog.Builder(this@MainActivity)
                                      .setMessage("حذف ${macro.name}؟")
                                      .setNegativeButton("إلغاء", null)
                                      .setPositiveButton("حذف") { _, _ ->
                                          TouchData.deleteMacro(this@MainActivity, macro.name)
                                          refreshService()
                                          render()
                                      }
                                      .show()
                              }
                          })
                          root.addView(row)
                      }
                  }

                  addText(
                      root,
                      "تُسجّل الإيماءة على لوحة التسجيل داخل التطبيق، ويمكن تشغيلها فوق التطبيقات عبر خدمة الوصول. قد تمنع بعض الشاشات المحمية تنفيذها.",
                      13f
                  )

                  setContentView(scroll)
              }

              private fun addText(root: LinearLayout, value: String, size: Float) {
                  root.addView(TextView(this).apply {
                      text = value
                      textSize = size
                      setTextColor(Color.LTGRAY)
                      setPadding(0, dp(6), 0, dp(6))
                  })
              }

              private fun addHeading(root: LinearLayout, value: String) {
                  root.addView(TextView(this).apply {
                      text = value
                      textSize = 19f
                      setTextColor(Color.WHITE)
                      setPadding(0, dp(16), 0, dp(5))
                  })
              }

              private fun addButton(
                  root: LinearLayout,
                  value: String,
                  action: () -> Unit
              ) {
                  root.addView(Button(this).apply {
                      text = value
                      setOnClickListener { action() }
                  })
              }

              private fun addActionSpinner(
                  root: LinearLayout,
                  title: String,
                  trigger: String
              ) {
                  addText(root, title, 15f)

                  val options = TouchData.actionOptions(this)
                  val spinner = Spinner(this)
                  val adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_item,
                      options.map { it.first }
                  )
                  adapter.setDropDownViewResource(
                      android.R.layout.simple_spinner_dropdown_item
                  )
                  spinner.adapter = adapter

                  val current = TouchData.action(this, trigger)
                  val selected = options.indexOfFirst {
                      it.second == current
                  }.coerceAtLeast(0)
                  spinner.setSelection(selected)

                  spinner.onItemSelectedListener =
                      object : AdapterView.OnItemSelectedListener {
                          override fun onNothingSelected(parent: AdapterView<*>?) = Unit

                          override fun onItemSelected(
                              parent: AdapterView<*>?,
                              view: View?,
                              position: Int,
                              id: Long
                          ) {
                              TouchData.setAction(
                                  this@MainActivity,
                                  trigger,
                                  options[position].second
                              )
                          }
                      }

                  root.addView(
                      spinner,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )
              }

              private fun addSlider(
                  root: LinearLayout,
                  title: String,
                  key: String,
                  minimum: Int,
                  maximum: Int,
                  defaultValue: Int,
                  suffix: String
              ) {
                  val label = TextView(this).apply {
                      textSize = 14f
                      setTextColor(Color.WHITE)
                  }
                  root.addView(label)

                  val seek = SeekBar(this)
                  seek.max = maximum - minimum
                  seek.progress = TouchData.prefs(this)
                      .getInt(key, defaultValue)
                      .coerceIn(minimum, maximum) - minimum

                  fun updateLabel(value: Int) {
                      label.text = "$title: $value$suffix"
                  }
                  updateLabel(minimum + seek.progress)

                  seek.setOnSeekBarChangeListener(
                      object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(
                              bar: SeekBar?,
                              progress: Int,
                              fromUser: Boolean
                          ) {
                              val value = minimum + progress
                              updateLabel(value)

                              if (fromUser) {
                                  TouchData.prefs(this@MainActivity).edit()
                                      .putInt(key, value)
                                      .apply()
                                  refreshService()
                              }
                          }

                          override fun onStartTrackingTouch(bar: SeekBar?) = Unit
                          override fun onStopTrackingTouch(bar: SeekBar?) = Unit
                      }
                  )

                  root.addView(seek)
              }

              private fun customizeMenu() {
                  val options = TouchData.menuOptions(this)
                  val selected = TouchData.menuItems(this).toMutableSet()
                  val checked = BooleanArray(options.size) {
                      selected.contains(options[it].second)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("اختر حتى 8 عناصر للقائمة")
                      .setMultiChoiceItems(
                          options.map { it.first }.toTypedArray(),
                          checked
                      ) { dialog, index, isChecked ->
                          val id = options[index].second

                          if (isChecked && selected.size >= 8) {
                              (dialog as AlertDialog).listView
                                  .setItemChecked(index, false)
                              Toast.makeText(
                                  this,
                                  "الحد الأقصى 8 عناصر",
                                  Toast.LENGTH_SHORT
                              ).show()
                          } else if (isChecked) {
                              selected.add(id)
                          } else {
                              selected.remove(id)
                          }
                      }
                      .setNegativeButton("إلغاء", null)
                      .setPositiveButton("حفظ") { _, _ ->
                          val ordered = options.map { it.second }
                              .filter { selected.contains(it) }
                          TouchData.setMenuItems(this, ordered)
                          refreshService()
                          Toast.makeText(
                              this,
                              "تم حفظ القائمة",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      .show()
              }

              private fun refreshService() {
                  sendBroadcast(
                      Intent(TouchAccessibilityService.ACTION_REFRESH)
                          .setPackage(packageName)
                  )
              }
          }

          class GestureEditorActivity : Activity() {
              private lateinit var nameField: EditText
              private lateinit var drawingView: GestureDrawingView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      setBackgroundColor(Color.rgb(20, 20, 24))
                  }

                  root.addView(TextView(this).apply {
                      text = "ارسم الإيماءة. يمكن استخدام أكثر من إصبع."
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, dp(8))
                  })

                  nameField = EditText(this).apply {
                      setText("Macro 1")
                      hint = "اسم الإيماءة"
                      setSingleLine(true)
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.LTGRAY)
                      background = GradientDrawable().apply {
                          setColor(Color.rgb(45, 44, 49))
                          cornerRadius = dp(12).toFloat()
                      }
                      setPadding(dp(10), dp(8), dp(10), dp(8))
                  }
                  root.addView(nameField)

                  drawingView = GestureDrawingView(this)
                  root.addView(
                      drawingView,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      ).apply {
                          topMargin = dp(10)
                          bottomMargin = dp(10)
                      }
                  )

                  val buttons = LinearLayout(this)

                  buttons.addView(
                      Button(this).apply {
                          text = "مسح"
                          setOnClickListener { drawingView.clearDrawing() }
                      },
                      LinearLayout.LayoutParams(0, dp(52), 1f)
                  )

                  buttons.addView(
                      Button(this).apply {
                          text = "حفظ الإيماءة"
                          setOnClickListener { saveDrawing() }
                      },
                      LinearLayout.LayoutParams(0, dp(52), 1f)
                  )

                  root.addView(buttons)
                  setContentView(root)
              }

              private fun saveDrawing() {
                  val name = nameField.text.toString().trim()
                  val strokes = drawingView.getStrokes()

                  if (name.isEmpty() || strokes.isEmpty()) {
                      Toast.makeText(
