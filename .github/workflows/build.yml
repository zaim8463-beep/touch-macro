          class GestureDrawingView(context: Context) : View(context) {
              private data class RecordingStroke(
                  val startMs: Long,
                  val points: MutableList<GesturePoint>,
                  var endMs: Long
              )

              private val finishedStrokes = mutableListOf<GestureStroke>()
              private val activeStrokes = mutableMapOf<Int, RecordingStroke>()
              private var firstDownTime = 0L

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  strokeWidth = 5f * resources.displayMetrics.density
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
              }

              fun clearDrawing() {
                  finishedStrokes.clear()
                  activeStrokes.clear()
                  invalidate()
              }

              fun getStrokes(): List<GestureStroke> {
                  val result = finishedStrokes.toMutableList()

                  activeStrokes.values.forEach { stroke ->
                      if (stroke.points.isNotEmpty()) {
                          result.add(
                              GestureStroke(
                                  stroke.startMs,
                                  (stroke.endMs - stroke.startMs).coerceIn(80L, 10000L),
                                  stroke.points.toList()
                              )
                          )
                      }
                  }

                  return result.take(10)
              }

              private fun normalized(x: Float, y: Float): GesturePoint {
                  return GesturePoint(
                      if (width > 0) (x / width).coerceIn(0f, 1f) else 0.5f,
                      if (height > 0) (y / height).coerceIn(0f, 1f) else 0.5f
                  )
              }

              private fun beginStroke(
                  pointerId: Int,
                  startMs: Long,
                  x: Float,
                  y: Float
              ) {
                  if (activeStrokes.size >= 10) return

                  activeStrokes[pointerId] = RecordingStroke(
                      startMs.coerceIn(0L, 10000L),
                      mutableListOf(normalized(x, y)),
                      startMs
                  )
              }

              private fun addPoint(
                  pointerId: Int,
                  x: Float,
                  y: Float,
                  eventTime: Long
              ) {
                  val stroke = activeStrokes[pointerId] ?: return

                  if (stroke.points.size < 1200) {
                      stroke.points.add(normalized(x, y))
                  }

                  val relativeTime = (eventTime - firstDownTime).coerceAtLeast(0L)
                  stroke.endMs = relativeTime
                      .coerceAtLeast(stroke.startMs + 80L)
                      .coerceAtMost(10000L)
              }

              private fun endStroke(pointerId: Int, eventTime: Long) {
                  val stroke = activeStrokes.remove(pointerId) ?: return
                  val relativeTime = (eventTime - firstDownTime).coerceAtLeast(0L)
                  val duration = (relativeTime - stroke.startMs).coerceIn(80L, 10000L)

                  if (stroke.points.isNotEmpty()) {
                      finishedStrokes.add(
                          GestureStroke(
                              stroke.startMs,
                              duration,
                              stroke.points.toList()
                          )
                      )
                  }
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  canvas.drawColor(Color.rgb(45, 44, 49))

                  fun drawPath(points: List<GesturePoint>) {
                      if (points.isEmpty()) return

                      val path = Path()
                      path.moveTo(points.first().x * width, points.first().y * height)
                      points.drop(1).forEach {
                          path.lineTo(it.x * width, it.y * height)
                      }

                      if (points.size == 1) {
                          path.lineTo(
                              points.first().x * width + 2f,
                              points.first().y * height + 2f
                          )
                      }
                      canvas.drawPath(path, paint)
                  }

                  finishedStrokes.forEach { drawPath(it.points) }
                  activeStrokes.values.forEach { drawPath(it.points) }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          finishedStrokes.clear()
                          activeStrokes.clear()
                          firstDownTime = event.eventTime
                          beginStroke(
                              event.getPointerId(0),
                              0L,
                              event.x,
                              event.y
                          )
                          invalidate()
                          return true
                      }

                      MotionEvent.ACTION_POINTER_DOWN -> {
                          val index = event.actionIndex
                          beginStroke(
                              event.getPointerId(index),
                              event.eventTime - firstDownTime,
                              event.getX(index),
                              event.getY(index)
                          )
                          invalidate()
                          return true
                      }

                      MotionEvent.ACTION_MOVE -> {
                          for (history in 0 until event.historySize) {
                              val time = event.getHistoricalEventTime(history)
                              for (index in 0 until event.pointerCount) {
                                  addPoint(
                                      event.getPointerId(index),
                                      event.getHistoricalX(index, history),
                                      event.getHistoricalY(index, history),
                                      time
                                  )
                              }
                          }

                          for (index in 0 until event.pointerCount) {
                              addPoint(
                                  event.getPointerId(index),
                                  event.getX(index),
                                  event.getY(index),
                                  event.eventTime
                              )
                          }

                          invalidate()
                          return true
                      }

                      MotionEvent.ACTION_POINTER_UP -> {
                          val index = event.actionIndex
                          val pointerId = event.getPointerId(index)
                          addPoint(
                              pointerId,
                              event.getX(index),
                              event.getY(index),
                              event.eventTime
                          )
                          endStroke(pointerId, event.eventTime)
                          invalidate()
                          return true
                      }

                      MotionEvent.ACTION_UP -> {
                          val pointerId = event.getPointerId(0)
                          addPoint(pointerId, event.x, event.y, event.eventTime)
                          endStroke(pointerId, event.eventTime)
                          invalidate()
                          return true
                      }

                      MotionEvent.ACTION_CANCEL -> {
                          activeStrokes.keys.toList().forEach {
                              endStroke(it, event.eventTime)
                          }
                          invalidate()
                          return true
                      }
                  }

                  return true
              }
          }
