              private fun runAction(action: String) {
                  when {
                      action == "none" || action == "close" -> Unit

                      action == "menu" -> {
                          if (menuView == null) showMainMenu() else hideMenu()
                      }

                      action == "back" ->
                          performGlobalAction(GLOBAL_ACTION_BACK)

                      action == "home" ->
                          performGlobalAction(GLOBAL_ACTION_HOME)

                      action == "recents" ->
                          performGlobalAction(GLOBAL_ACTION_RECENTS)

                      action == "notifications" ->
                          performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS)

                      action == "quick" ->
                          performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS)

                      action == "device" -> showDeviceMenu()

                      action == "gestures" -> showGesturesMenu()

                      action == "settings" -> {
                          startActivity(
                              Intent(this, MainActivity::class.java)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                      }

                      action == "assistant" -> {
                          try {
                              startActivity(
                                  Intent(Intent.ACTION_VOICE_COMMAND)
                                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              )
                          } catch (_: Exception) {
                          }
                      }

                      action == "volume_up" ||
                          action == "volume_down" ||
                          action == "mute" ||
                          action == "unmute" -> {
                          val audio = getSystemService(AUDIO_SERVICE) as AudioManager
                          val direction = when (action) {
                              "volume_up" -> AudioManager.ADJUST_RAISE
                              "volume_down" -> AudioManager.ADJUST_LOWER
                              "mute" -> AudioManager.ADJUST_MUTE
                              else -> AudioManager.ADJUST_UNMUTE
                          }

                          audio.adjustStreamVolume(
                              AudioManager.STREAM_MUSIC,
                              direction,
                              AudioManager.FLAG_SHOW_UI
                          )
                      }

                      action == "lock" && Build.VERSION.SDK_INT >= 28 ->
                          performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN)

                      action == "screenshot" && Build.VERSION.SDK_INT >= 28 ->
                          performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT)

                      action.startsWith("macro:") -> {
                          val name = action.substringAfter("macro:")
                          TouchData.macros(this)
                              .firstOrNull { it.name == name }
                              ?.let { dispatchMacro(it) }
                      }

                      action.startsWith("preset:") ->
                          playPreset(action.substringAfter("preset:"))
                  }
              }

              private fun playPreset(name: String) {
                  val center = GesturePoint(0.5f, 0.5f)
                  val tinyMove = GesturePoint(0.502f, 0.5f)

                  val strokes = when (name) {
                      "double" -> listOf(
                          GestureStroke(0L, 90L, listOf(center, tinyMove)),
                          GestureStroke(180L, 90L, listOf(center, tinyMove))
                      )

                      "long" -> listOf(
                          GestureStroke(0L, 750L, listOf(center, tinyMove))
                      )

                      "drag" -> listOf(
                          GestureStroke(
                              0L,
                              650L,
                              listOf(
                                  GesturePoint(0.32f, 0.58f),
                                  GesturePoint(0.48f, 0.58f),
                                  GesturePoint(0.68f, 0.58f)
                              )
                          )
                      )

                      "pinch" -> {
                          val firstFinger = mutableListOf<GesturePoint>()
                          val secondFinger = mutableListOf<GesturePoint>()

                          for (i in 0..14) {
                              val t = i / 14.0
                              val radius = 0.22 - 0.12 * t
                              val angle = -PI / 2.0 + t * PI / 2.0

                              firstFinger.add(
                                  GesturePoint(
                                      (0.5 + radius * cos(angle)).toFloat(),
                                      (0.5 + radius * sin(angle)).toFloat()
                                  )
                              )

                              secondFinger.add(
                                  GesturePoint(
                                      (0.5 + radius * cos(angle + PI)).toFloat(),
                                      (0.5 + radius * sin(angle + PI)).toFloat()
                                  )
                              )
                          }

                          listOf(
                              GestureStroke(0L, 700L, firstFinger),
                              GestureStroke(0L, 700L, secondFinger)
                          )
                      }

                      else -> emptyList()
                  }

                  if (strokes.isNotEmpty()) {
                      dispatchStrokes(strokes)
                  }
              }

              private fun dispatchMacro(macro: SavedMacro) {
                  dispatchStrokes(macro.strokes)
              }

              private fun dispatchStrokes(strokes: List<GestureStroke>) {
                  if (strokes.isEmpty()) return

                  val screen = realScreenSize()
                  val maxX = (screen.x - 1).coerceAtLeast(1)
                  val maxY = (screen.y - 1).coerceAtLeast(1)
                  val builder = GestureDescription.Builder()

                  strokes.take(10).forEach { stroke ->
                      if (stroke.points.isEmpty()) return@forEach

                      fun screenX(point: GesturePoint): Float =
                          (point.x * maxX).coerceIn(0f, maxX.toFloat())

                      fun screenY(point: GesturePoint): Float =
                          (point.y * maxY).coerceIn(0f, maxY.toFloat())

                      val first = stroke.points.first()
                      val path = Path()
                      path.moveTo(screenX(first), screenY(first))

                      stroke.points.drop(1).forEach {
                          path.lineTo(screenX(it), screenY(it))
                      }

                      val stationary = stroke.points.all {
                          abs(it.x - first.x) < 0.001f &&
                              abs(it.y - first.y) < 0.001f
                      }

                      if (stroke.points.size == 1 || stationary) {
                          val x = screenX(first)
                          val nextX = if (x < maxX - 1f) {
                              x + 1f
                          } else {
                              (x - 1f).coerceAtLeast(0f)
                          }
                          path.lineTo(nextX, screenY(first))
                      }

                      try {
                          builder.addStroke(
                              GestureDescription.StrokeDescription(
                                  path,
                                  stroke.startMs.coerceIn(0L, 10000L),
                                  stroke.durationMs.coerceIn(80L, 10000L)
                              )
                          )
                      } catch (_: Exception) {
                      }
                  }

                  try {
                      dispatchGesture(builder.build(), null, null)
                  } catch (_: Exception) {
                  }
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              override fun onAccessibilityEvent(event: AccessibilityEvent) {
                  // الخدمة لا تقرأ محتوى الشاشة.
              }

              override fun onInterrupt() = Unit

              override fun onDestroy() {
                  cancelLongPress()
                  singleTapTask?.let { handler.removeCallbacks(it) }
                  idleTask?.let { handler.removeCallbacks(it) }

                  if (receiverRegistered) {
                      try {
                          unregisterReceiver(refreshReceiver)
                      } catch (_: Exception) {
                      }
                  }

                  hideMenu()

                  try {
                      bubble?.let { windowManager.removeView(it) }
                  } catch (_: Exception) {
                  }

                  bubble = null
                  super.onDestroy()
              }
          }

          private class AssistiveBubble(context: Context) : View(context) {
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)

                  val centerX = width / 2f
                  val centerY = height / 2f
                  val radius = minOf(width, height) * 0.47f

                  paint.style = Paint.Style.FILL
                  paint.color = Color.argb(215, 70, 70, 78)
                  canvas.drawCircle(centerX, centerY, radius, paint)

                  paint.style = Paint.Style.STROKE
                  paint.strokeWidth = context.dp(1).toFloat()
                  paint.color = Color.WHITE
                  canvas.drawCircle(centerX, centerY, radius * 0.67f, paint)
                  canvas.drawCircle(centerX, centerY, radius * 0.43f, paint)

                  paint.style = Paint.Style.FILL
                  canvas.drawCircle(centerX, centerY, radius * 0.18f, paint)
              }
          }
          EOF

      - name: Build APK
        run: |
          curl -fsSL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Touch-Assist-APK
          path: app/build/outputs/apk/debug/app-debug.apk
