                              params.x = (originalX + dx.toInt())
                                  .coerceIn(0, (screen.x - params.width).coerceAtLeast(0))
                              params.y = (originalY + dy.toInt())
                                  .coerceIn(0, (screen.y - params.height).coerceAtLeast(0))

                              try {
